version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: homepulse
      POSTGRES_PASSWORD: homepulse_password
      POSTGRES_DB: homepulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homepulse-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - homepulse-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./.env
    networks:
      - homepulse-network

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./.env
    networks:
      - homepulse-network

  admin:
    build:
      context: ./admin
      dockerfile: ../docker/Dockerfile.admin
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3000/api/v1
    networks:
      - homepulse-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - admin
      - backend
    networks:
      - homepulse-network

volumes:
  postgres_data:
  redis_data:

networks:
  homepulse-network:
    driver: bridge