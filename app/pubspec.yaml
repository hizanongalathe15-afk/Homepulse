name: homepulse
description: Homepulse - Property Rental & Management App

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.18.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.6.0
  geolocator: ^11.0.0
  flutter_map: ^8.3.1
  mobile_scanner: ^4.0.0
  permission_handler: ^11.3.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.9.2
  freezed: ^2.5.7
  flutter_gen_runner: ^5.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
