apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepulse-backend
  namespace: homepulse
  labels:
    app: homepulse-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: homepulse-backend
  template:
    metadata:
      labels:
        app: homepulse-backend
    spec:
      containers:
      - name: backend
        image: homepulse/backend:latest
        ports:
        - containerPort: 3000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: homepulse-config
        - secretRef:
            name: homepulse-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        emptyDir: {}
